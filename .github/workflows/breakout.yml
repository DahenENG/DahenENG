# Draws the Breakout game from the contribution graph and publishes it to the "output" branch, which the README shows.
name: Generate breakout

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: cyprieng/github-breakout@v1.2.4
        with:
          github_username: ${{ github.repository_owner }}
          output_path: dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
